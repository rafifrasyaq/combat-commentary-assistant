spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/combatassistant
spring.datasource.username=combatassistant
spring.datasource.password=combatassistant

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

app.storage.video-dir=storage/videos

# Internal Python AI service (not exposed through user API)
app.ai.service-url=${AI_SERVICE_URL:http://localhost:8000}
